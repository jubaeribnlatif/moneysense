  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

art__in\"><div class=\"cardart__top\"><span class=\"cardart__bank\">Sample Bank<\/span><span class=\"cardart__mark\"><i><\/i><i><\/i><\/span><\/div><span class=\"cardart__chip\"><\/span><div class=\"cardart__bot\"><span class=\"cardart__name\">Voyager Plus<\/span><span class=\"cardart__ill\">Illustrative<\/span><\/div><\/div><\/div>\n      <div class=\"cardart cardart--brand hv__b\"><div class=\"cardart__in\"><div class=\"cardart__top\"><span class=\"cardart__bank\">Demo Bank<\/span><span class=\"cardart__mark\"><i><\/i><i><\/i><\/span><\/div><span class=\"cardart__chip\"><\/span><div class=\"cardart__bot\"><span class=\"cardart__name\">Dine and Shop<\/span><span class=\"cardart__ill\">Illustrative<\/span><\/div><\/div><\/div>\n      <div class=\"cardart cardart--paper hv__c\"><div class=\"cardart__in\"><div class=\"cardart__top\"><span class=\"cardart__bank\">Example Bank<\/span><span class=\"cardart__mark\"><i><\/i><i><\/i><\/span><\/div><span class=\"cardart__chip\"><\/span><div class=\"cardart__bot\"><span class=\"cardart__name\">Everyday Cashback<\/span><span class=\"cardart__ill\">Illustrative<\/span><\/div><\/div><\/div>\n      <span class=\"hv__tag\" style=\"top:17.7%;transform:translateY(-50%)\"><x-import component-from-global-scope=\"MoneySense.Icon\" name=\"plane\" size=\"18\"><\/x-import>Lounge access<\/span>\n      <span class=\"hv__tag\" style=\"top:48.7%;transform:translateY(-50%)\"><x-import component-from-global-scope=\"MoneySense.Icon\" name=\"dining\" size=\"18\"><\/x-import>Dining offers<\/span>\n      <span class=\"hv__tag\" style=\"top:79.7%;transform:translateY(-50%)\"><x-import component-from-global-scope=\"MoneySense.Icon\" name=\"calendar\" size=\"18\"><\/x-import>Instalments<\/span>\n      <span class=\"ms-caption hv__cap\">Fictional cards and benefits<\/span>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section id=\"discover\" class=\"sec sec--surface\" aria-labelledby=\"disc-title\">\n  <div class=\"wrap disc\">\n    <div class=\"stack--sm s ons__foot\">\n        <span class=\"ms-caption\">Paid placement. Sponsors do not change which cards match your answers or how cards are listed.<\/span>\n        <button type=\"button\" class=\"linkbtn linkbtn--info linkbtn--inline\" sc-camel-on-click=\"{{ goMethod }}\">How we work<\/button>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section id=\"offers\" class=\"sec\" aria-labelledby=\"off-title\">\n  <div class=\"wrap\">\n    <header class=\"ms-sechead sechead-gap\">\n      <div><p class=\"ms-overline\"><span class=\"ms-slab ms-slab--brand\" style=\"width:14px;height:8px\"><\/span>Offers<\/p><h2 id=\"off-title\" class=\"ms-sechead__title\">Worth a look today<\/h2><p class=\"ms-sechead__dek\">Current offers worth knowing about.<\/p><\/div>\n      <button type=\"button\" class=\"linkbtn\" sc-camel-on-click=\"{{ viewAllOffers }}\">View all offers <x-import component-from-global-scope=\"MoneySense.Icon\" name=\"arrow\" size=\"16\"><\/x-import><\/button>\n    <\/header>\n    <div class=\"chips\" role=\"group\" aria-label=\"Offer categories\">\n      <sc-for list=\"{{ homeCats }}\" as=\"c\" hint-placeholder-count=\"7\">\n        <button type=\"button\" class=\"{{ c.cls }}\" aria-pressed=\"{{ c.on }}\" sc-camel-on-click=\"{{ c.go }}\"><span>{{ c.label }}<\/span><\/button>\n      <\/sc-for>\n      <button type=\"button\" class=\"{{ homeEndingCls }}\" aria-pressed=\"{{ homeEnding }}\" sc-camel-on-click=\"{{ toggleEnding }}\"><x-import component-from-global-scope=\"MoneySense.Icon\" name=\"clock\" size=\"16\"><\/x-import><span>Ending within 14 days<\/span><\/button>\n    <\/div>\n    <div class=\"resultline\"><p class=\"t-sm\" role=\"status\">{{ homeCount }}<\/p><\/div>\n    <div class=\"grid3\">\n      <sc-for list=\"{{ homeOffers }}\" as=\"of\" hint-placeholder-count=\"3\">\n        <dc-import name=\"OfferCard\" item=\"{{ of }}\" hint-size=\"100%,380px\"><\/dc-import>\n      <\/sc-for>\n    <\/div>\n    <sc-if value=\"{{ homeEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"empty\"><p class=\"t-h4\">No offers match this selection.<\/p><p class=\"t-sm\">Try another category or turn off the ending-soon filter.<\/p><x-import component-from-global-scope=\"MoneySense.Button\" variant=\"secondary\" size=\"md\" on-click=\"{{ viewAllOffers }}\">See all active offers<\/x-import><\/div>\n    <\/sc-if>\n  <\/div>\n<\/section>\n<section id=\"finder\" class=\"sec sec--surface\" aria-labelledby=\"ft-title\">\n  <div class=\"wrap ft\">\n    <div class=\"stack\">\n      <p class=\"ms-overline\"><span class=\"ms-slab ms-slab--brand\" style=\"width:14px;height:8px\"><\/span>Card Finder<\/p>\n      <h2 id=\"ft-title\" class=\"t-h2\">Find a card that fits your life<\/h2>\n      <p class=\"t-lede\">Your spending habits matter more than a long list of benefits.<\/p>\n      <p class=\"t-sm\">Five short questions. About a minute. No sign-up, and we keep nothing you choose here.<\/p>\n      <button type=\"button\" class=\"linkbtn linkbtn--info\" sc-camel-on-click=\"{{ goMethod }}\">How matching works<\/button>\n    <\/div>\n    <div class=\"ft__panel\">\n      <div class=\"ms-question\">\n        <div class=\"ms-steps\" role=\"img\" aria-label=\"Question 1 of 5\"><span class=\"ms-steps__bar is-done\"><\/span><span class=\"ms-steps__bar\"><\/span><span class=\"ms-steps__bar\"><\/span><span class=\"ms-steps__bar\"><\/span><span class=\"ms-steps__bar\"><\/span><\/div>\n        <p class=\"ms-overline\">Question 1 of 5<\/p>\n        <h3 class=\"ms-question__title\">What do you spend most on?<\/h3>\n        <p class=\"ms-question__hint\">Choose up to three.<\/p>\n        <div class=\"ms-options\" role=\"group\" aria-label=\"Spending areas\">\n          <sc-for list=\"{{ ftOpts }}\" as=\"p\" hint-placeholder-count=\"5\">\n            <button type=\"button\" role=\"checkbox\" aria-checked=\"{{ p.on }}\" class=\"{{ p.cls }}\" sc-camel-on-click=\"{{ p.go }}\"><x-import component-from-global-scope=\"MoneySense.Icon\" name=\"{{ p.icon }}\" size=\"22\"><\/x-import><span>{{ p.label }}<\/span><\/button>\n          <\/sc-for>\n        <\/div>\n        <div class=\"ms-question__nav\"><span><\/span><x-import component-from-global-scope=\"MoneySense.Button\" variant=\"primary\" size=\"md\" icon-right=\"arrow\" disabled=\"{{ ftNone }}\" on-click=\"{{ ftNext }}\">Continue<\/x-import><\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section id=\"compare\" class=\"sec\" aria-labelledby=\"cmp-title\">\n  <div class=\"wrap\">\n    <header class=\"ms-sechead sechead-gap\">\n      <div><p class=\"ms-overline\"><span class=\"ms-slab ms-slab--brand\" style=\"width:14px;height:8px\"><\/span>Compare<\/p><h2 id=\"cmp-title\" class=\"ms-sechead__title\">Different cards. A clearer picture.<\/h2><p class=\"ms-sechead__dek\">Same facts for every card. Pick up to three to see them side by side. This is not a ranking.<\/p><\/div>\n      <button type=\"button\" class=\"linkbtn\" sc-camel-on-click=\"{{ goCompareAll }}\">Compare all cards <x-import component-from-global-scope=\"MoneySense.Icon\" name=\"arrow\" size=\"16\"><\/x-import><\/button>\n    <\/header>\n    <div class=\"grid3\">\n      <sc-for list=\"{{ homeCards }}\" as=\"c\" hint-placeholder-count=\"3\">\n        <dc-import name=\"ProductCard\" item=\"{{ c }}\" hint-size=\"100%,720px\"><\/dc-import>\n      <\/sc-for>\n    <\/div>\n    <div class=\"row mt-6\">\n      <x-import component-from-global-scope=\"MoneySense.Button\" variant=\"primary\" size=\"md\" icon-left=\"compare\" disabled=\"{{ homeCmpDisabled }}\" on-click=\"{{ goCompare }}\">{{ homeCmpLabel }}<\/x-import>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section id=\"needs\" class=\"sec sec--surface\" aria-labelledby=\"needs-title\">\n  <div class=\"wrap\">\n    <header class=\"ms-sechead sechead-gap\">\n      <div><p class=\"ms-overline\"><span class=\"ms-slab ms-slab--brand\" style=\"width:14px;height:8px\"><\/span>Explore by need<\/p><h2 id=\"needs-title\" class=\"ms-sechead__title\">Start with \"{{ n.is_online }}\" hint-placeholder-val=\"{{ false }}\"><svg sc-camel-view-box=\"0 0 300 150\"><circle cx=\"150\" cy=\"75\" r=\"52\" fill=\"#fff\" stroke=\"#0a0a0a\" stroke-width=\"1.5\"><\/circle><ellipse cx=\"150\" cy=\"75\" rx=\"22\" ry=\"52\" fill=\"none\" stroke=\"#0a0a0a\" stroke-width=\"1.5\"><\/ellipse><path d=\"M98 75h104M106 52h88M106 98h88\" stroke=\"#0a0a0a\" stroke-width=\"1.5\" fill=\"none\"><\/path><rect x=\"200\" y=\"86\" width=\"40\" height=\"24\" rx=\"5\" fill=\"#188e6c\" transform=\"skewX(-18) translate(34 0)\"><\/rect><\/svg><\/sc-if>\n            <sc-if value=\"{{ n.is_everyday }}\" hint-placeholder-val=\"{{ false }}\"><svg sc-camel-view-box=\"0 0 300 150\"><rect x=\"70\" y=\"30\" width=\"160\" height=\"14\" rx=\"4\" fill=\"#0a0a0a\"><\/rect><rect x=\"70\" y=\"58\" width=\"120\" height=\"14\" rx=\"4\" fill=\"#c9c9c3\"><\/rect><rect x=\"70\" y=\"86\" width=\"140\" height=\"14\" rx=\"4\" fill=\"#c9c9c3\"><\/rect><rect x=\"196\" y=\"82\" width=\"44\" height=\"26\" rx=\"5\" fill=\"#188e6c\" transform=\"skewX(-18) translate(34 0)\"><\/rect><\/svg><\/sc-if>\n            <sc-if value=\"{{ n.is_premium }}\" hint-placeholder-val=\"{{ false }}\"><svg sc-camel-view-box=\"0 0 300 150\"><rect x=\"86\" y=\"30\" width=\"60\" height=\"90\" rx=\"10\" fill=\"none\" stroke=\"#0a0a0a\" stroke-width=\"1.5\" transform=\"skewX(-18) translate(34 0)\"><\/rect><rect x=\"122\" y=\"30\" width=\"60\" height=\"90\" rx=\"10\" fill=\"#0a0a0a\" transform=\"skewX(-18) translate(34 0)\"><\/rect><rect x=\"158\" y=\"30\" width=\"60\" height=\"90\" rx=\"10\" fill=\"#188e6c\" transform=\"skewX(-18) translate(34 0)\"><\/rect><\/svg><\/sc-if>\n          <\/div>\n          <div class=\"ntile__body\">\n            <h3 class=\"t-h3\">{{ n.title }}<\/h3>\n            <p class=\"t-sm\">{{ n.desc }}<\/p>\n            <p class=\"ntile__meta\"><span>{{ n.counts }}<\/span><x-import component-from-global-scope=\"MoneySense.Icon\" name=\"arrow\" size=\"18\"><\/x-import><\/p>\n          <\/div>\n        <\/button>\n      <\/sc-for>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section id=\"guides\" class=\"sec\" aria-labelledby=\"gd-title\">\n  <div class=\"wrap\">\n    <header class=\"ms-sechead sechead-gap\">\n      <div><p class=\"ms-overline\"><span class=\"ms-slab ms-slab--brand\" style=\"width:14px;height:8px\"><\/span>Money Guides<\/p><h2 id=\"gd-title\" class=\"ms-sechead__title\">Understand money better<\/h2><p class=\"ms-sechead__dek\">Plain-language guides from The Daily Star, written independently of any bank.<\/p><\/div>\n      <button type=\"button\" class=\"linkbtn\" sc-camel-on-click=\"{{ goGuides }}\">Read all Money Guides <x-import component-from-global-scope=\"MoneySense.Icon\" name=\"arrow\" size=\"16\"><\/x-import><\/button>\n    <\/header>\n    <div class=\"grid3\">\n      <sc-for list=\"{{ homeGuides }}\" as=\"g\" hint-placeholder-count=\"3\">\n        <dc-import name=\"GuideItem\" item=\"{{ g }}\" hint-size=\"100%,260px\"><\/dc-import>\n      <\/sc-for>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section id=\"how\" class=\"sec sec--surface\" aria-labelledby=\"how-title\">\n  <div class=\"wrap stack--lg stack\">\n    <div class=\"stack--sm stack\"><p class=\"ms-overline\"><span class=\"ms-slab ms-slab--brand\" style=\"width:14px;height:8px\"><\/span>How Money Sense works<\/p><h2 id=\"how-title\" class=\"t-h2\">Better information. More confident choices.<\/h2><\/div>\n    <div class=\"steps3\">\n      <div class=\"step\"><p class=\"step__n\"><span class=\"ms-slab ms-slab--brand\" style=\"width:14px;height:8px\"><\/span>Step 1<\/p><h3 class=\"t-h3\">Discover<\/h3><p class=\"t-body\">Find products and offers in one place.<\/p><\/div>\n      <div class=\"step\"><p class=\"step__n\"><span class=\"ms-slab ms-slab--brand\" style=\"width:14px;height:8px\"><\/span>Step 2<\/p><h3 class=\"t-h3\">Compare<\/h3><p class=\"t-body\">Understand costs, benefits and suitability using the same facts for every card.<\/p><\/div>\n      <div class=\"step\"><p class=\"step__n\"><span class=\"ms-slab ms-slab--brand\" style=\"width:14px;height:8px\"><\/span>Step 3<\/p><h3 class=\"t-h3\">Choose<\/h3><p class=\"t-body\">Explore the details and decide what works for you.<\/p><\/div>\n    <\/div>\n    <aside class=\"ms-callout ms-callout--methodology\">\n      <div class=\"ms-callout__head\"><span class=\"ms-callout__mark\"><x-import component-from-global-scope=\"MoneySense.Icon\" name=\"info\" size=\"16\"><\/x-import><\/span><span class=\"ms-callout__kind\">How we work<\/span><span class=\"ms-callout__rule\" aria-hidden=\"true\"><\/span><\/div>\n      <div class=\"ms-callout__main\"><p class=\"ms-callout__title\">Product facts follow one structure. Sponsored placements are labelled.<\/p><div class=\"ms-callout__body\">Money Sense does not guarantee savings, and no product suits everyone. Banks can pay for visibility. They cannot pay for how cards match your answers.<\/div><button type=\"button\" class=\"ms-callout__action\" sc-camel-on-click=\"{{ goMethod }}\"><span>Read our method and disclosures<\/span><x-import component-from-global-scope=\"MoneySense.Icon\" name=\"arrow\" size=\"16\"><\/x-import><\/button><\/div>\n    <\/aside>\n  <\/div>\n<\/section>\n\n<section class=\"sec sec--inverse\" aria-labelledby=\"season-title\">\n  <div class=\"wrap season\">\n    <div class=\"stack\">\n      <p class=\"ms-overline\"><span class=\"ms-slab ms-slab--brand\" style=\"width:14px;height:8px\"><\/span>{{ sOverline }}<\/p>\n      <h2 id=\"season-title\" class=\"t-h2\">{{ sTitle }}<\/h2>\n      <p class=\"t-body\">{{ sDek }}<\/p>\n    <\/div>\n    <div class=\"season__cols\">\n      <div class=\"season__col\"><p class=\"ms-overline\">Offers to check<\/p><sc-for list=\"{{ sOffers }}\" as=\"x\" hint-placeholder-count=\"3\"><button type=\"button\" class=\"season__item\" sc-camel-on-click=\"{{ x.go }}\"><b>{{ x.title }}<\/b><span>{{ x.meta }}<\/span><\/button><\/sc-for><\/div>\n      <div class=\"season__col\"><p class=\"ms-overline\">Guides to read<\/p><sc-for list=\"{{ sGuides }}\" as=\"x\" hint-placeholder-count=\"2\"><button type=\"button\" class=\"season__item\" sc-camel-on-click=\"{{ x.go }}\"><b>{{ x.title }}<\/b><span>{{ x.meta }}<\/span><\/button><\/sc-for><\/div>\n      <div class=\"season__col\"><p class=\"ms-overline\">Cards to explore<\/p><sc-for list=\"{{ sCards }}\" as=\"x\" hint-placeholder-count=\"2\"><button type=\"button\" class=\"season__item\" sc-camel-on-click=\"{{ x.go }}\"><b>{{ x.title }}<\/b><span>{{ x.meta }}<\/span><\/button><\/sc-for><\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section class=\"sec\" aria-labelledby=\"nl-title\">\n  <div class=\"wrap nl\">\n    <div class=\"stack--sm stack\">\n      <h2 id=\"nl-title\" class=\"t-h2\">Useful money updates. No unnecessary noise.<\/h2>\n      <p class=\"t-body\">A weekly note from The Daily Star: new offers, offers about to end, new card information and one guide. Unsubscribe at any time.<\/p>\n    <\/div>\n    <div>\n      <sc-if value=\"{{ nlForm }}\" hint-placeholder-val=\"{{ true }}\">\n        <form class=\"nl__form\" sc-camel-on-submit=\"{{ submitNl }}\" novalidate=\"\">\n          <div class=\"ms-field\" style=\"max-width:none\">\n            <label class=\"ms-field__label\" for=\"nl-email\">Email address<\/label>\n            <div class=\"ms-field__box\"><input id=\"nl-email\" class=\"ms-field__input\" type=\"email\" autocomplete=\"email\" placeholder=\"name@example.com\" value=\"{{ nlEmail }}\" sc-camel-on-change=\"{{ onNlEmail }}\"><\/div>\n          <\/div>\n          <label class=\"nl__check\"><input type=\"checkbox\" checked=\"{{ nlConsent }}\" sc-camel-on-change=\"{{ onNlConsent }}\"><span>I agree to receive the Money Brief by email. We use your address only for this and never share it with banks.<\/span><\/label>\n          <sc-if value=\"{{ hasNlErr }}\" hint-placeholder-val=\"{{ false }}\"><p class=\"nl__err\" role=\"alert\"><x-import component-from-global-scope=\"MoneySense.Icon\" name=\"info\" size=\"18\"><\/x-import><span>{{ nlErr }}<\/span><\/p><\/sc-if>\n          <div><x-import component-from-global-scope=\"MoneySense.Button\" variant=\"primary\" size=\"md\" type=\"submit\">Subscribe<\/x-import><\/div>\n        <\/form>\n      <\/sc-if>\n      <sc-if value=\"{{ nlOk }}\" hint-placeholder-val=\"{{ false }}\"><p class=\"nl__ok\" role=\"status\"><x-import component-from-global-scope=\"MoneySense.Icon\" name=\"check\" size=\"18\"><\/x-import><span>{{ nlSent }}<\/span><\/p><\/sc-if>\n    <\/div>\n  <\/div>\n<\/section>\n<\/sc-if>\n<sc-if value=\"{{ isFinder }}\" hint-placeholder-val=\"{{ false }}\">\n<section class=\"sec finder\" aria-label=\"Card Finder\">\n  <div class=\"wrap stack--lg stack\">\n    <sc-if value=\"{{ isQ }}\" hint-placeholder-val=\"{{ true }}\">\n      <div class=\"stack--sm stack\"><p class=\"ms-overline\"><span class=\"ms-slab ms-slab--brand\" style=\"width:14px;height:8px\"><\/span>Card Finder<\/p><p class=\"t-sm\">We ask only what is needed to match cards. Nothing is stored or sent from this prototype.<\/p><\/div>\n      <div class=\"ms-question {{ qAnim }}\" role=\"group\" aria-labelledby=\"fq-title\">\n        <div class=\"ms-steps\" role=\"img\" aria-label=\"{{ qLabel }}\"><sc-for list=\"{{ qBars }}\" as=\"b\" hint-placeholder-count=\"5\"><span class=\"{{ b.cls }}\"><\/span><\/sc-for><\/div>\n        <p class=\"ms-overline\">{{ qLabel }}<\/p>\n        <h1 id=\"fq-title\" class=\"ms-question__title\">{{ qTitle }}<\/h1>\n        <p class=\"ms-question__hint\">{{ qHint }}<\/p>\n        <div class=\"ms-options\" role=\"{{ qGroupRole }}\">\n          <sc-for list=\"{{ qOpts }}\" as=\"p\" hint-placeholder-count=\"4\">\n            <button type=\"button\" role=\"{{ qRole }}\" aria-checked=\"{{ p.on }}\" class=\"{{ p.cls }}\" sc-camel-on-click=\"{{ p.go }}\">\n              <sc-if value=\"{{ p.hasIcon }}\" hint-placeholder-val=\"{{ false }}\"><x-import component-from-global-scope=\"MoneySense.Icon\" name=\"{{ p.icon }}\" size=\"22\"><\/x-import><\/sc-if>\n              <span class=\"ms-option__txt\"><span>{{ p.label }}<\/span><sc-if value=\"{{ p.hasDesc }}\" hint-placeholder-val=\"{{ false }}\"><small>{{ p.desc }}<\/small><\/sc-if><\/span>\n              <sc-if value=\"{{ p.on }}\" hint-placeholder-val=\"{{ false }}\"><x-import component-from-global-scope=\"MoneySense.Icon\" name=\"check\" size=\"18\"><\/x-import><\/sc-if>\n            <\/button>\n          <\/sc-for>\n        <\/div>\n        <div class=\"ms-question__nav\">\n          <span><x-import component-from-global-scope=\"MoneySense.Button\" variant=\"ghost\" icon-left=\"arrow\" on-click=\"{{ qBack }}\">Back<\/x-import><\/span>\n          <div class=\"row\"><button type=\"button\" class=\"linkbtn\" sc-camel-on-click=\"{{ qSkip }}\">{{ qSkipLabel }}<\/button><x-import component-from-global-scope=\"MoneySense.Button\" variant=\"primary\" size=\"lg\" icon-right=\"arrow\" disabled=\"{{ qNextDisabled }}\" on-click=\"{{ qNext }}\">{{ qNextLabel }}<\/x-import><\/div>\n        <\/div>\n      <\/div>\n    <\/sc-if>\n    <sc-if value=\"{{ isRes }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"stack--sm stack\">\n        <p class=\"ms-overline\"><span class=\"ms-slab ms-slab--brand\" style=\"width:14px;height:8px\"><\/span>Your results<\/p>\n        <h1 class=\"t-lg\">{{ resTitle }}<\/h1>\n        <sc-if value=\"{{ hasAnswers }}\" hint-placeholder-val=\"{{ true }}\"><div class=\"answers\"><span class=\"t-sm\">Your answers:<\/span><sc-for list=\"{{ answers }}\" as=\"a\" hint-placeholder-count=\"3\"><span class=\"pill\">{{ a.label }}<\/span><\/sc-for><button type=\"button\" class=\"linkbtn\" sc-camel-on-click=\"{{ fChange }}\">Change answers<\/button><\/div><\/sc-if>\n        <p class=\"t-sm\">Listed by how many of your answers each card matches, then A to Z. Sponsorship plays no part.<\/p>\n      <\/div>\n      <sc-if value=\"{{ resEmpty }}\" hint-placeholder-val=\"{{ false }}\"><div class=\"empty\"><p class=\"t-h4\">Nothing fits every answer.<\/p><p class=\"t-sm\">Try a wider fee range, or choose either card type.<\/p><div class=\"row\"><x-import component-from-global-scope=\"MoneySense.Button\" variant=\"primary\" size=\"md\" on-click=\"{{ fChange }}\">Change answers<\/x-import><x-import component-from-global-scope=\"MoneySense.Button\" variant=\"secondary\" size=\"md\" on-click=\"{{ fRestart }}\">Start again<\/x-import><\/div><\/div><\/sc-if>\n      <div class=\"grid2\">\n        <sc-for list=\"{{ resCards }}\" as=\"c\" hint-placeholder-count=\"2\"><dc-import name=\"ProductCard\" item=\"{{ c }}\" hint-size=\"100%,820px\"><\/dc-import><\/sc-for>\n      <\/div>\n      <aside class=\"ms-callout ms-callout--methodology\"><div class=\"ms-callout__head\"><span class=\"ms-callout__mark\"><x-import component-from-global-scope=\"MoneySense.Icon\" name=\"info\" size=\"16\"><\/x-import><\/span><span class=\"ms-callout__kind\">How we work<\/span><span class=\"ms-callout__rule\" aria-hidden=\"true\"><\/span><\/div><div class=\"ms-callout__main\"><p class=\"ms-callout__title\">These cards match what you told us, using documented card facts.<\/p><div class=\"ms-callout__body\">This is not advice and not a ranking. Check fees and eligibility with the bank before you apply.<\/div><button type=\"button\" class=\"ms-callout__action\" sc-camel-on-click=\"{{ goMethod }}\"><span>Read how matching works<\/span><\/button><\/div><\/aside>\n      <sc-if value=\"{{ resSponsorShow }}\" hint-placeholder-val=\"{{ false }}\">\n        <div class=\"stack--sm stack\"><div class=\"row\"><x-import component-from-global-scope=\"MoneySense.Badge\" kind=\"sponsored\"><\/x-import><span class=\"t-label\">Shown separately, whatever your answers<\/span><\/div><div class=\"grid2\"><dc-import name=\"ProductCard\" item=\"{{ resSponsor }}\" hint-size=\"100%,720px\"><\/dc-import><\/div><\/div>\n      <\/sc-if>\n      <div class=\"row\"><x-import component-from-global-scope=\"MoneySense.Button\" variant=\"secondary\" size=\"md\" on-click=\"{{ fRestart }}\" documented card facts: what the card is built for, its benefits, travel fit, annual fee and card type. Cards are listed by how many of your answers they match, then A to Z. No card is scored, starred or called best.<\/p><\/section>\n    <section class=\"stack--sm stack\"><h2 class=\"t-h3\">The ten criteria<\/h2><ol class=\"methodlist\"><li><span class=\"n\">1<\/span><span>Annual cost<\/span><\/li><li><span class=\"n\">2<\/span><span>Reward value<\/span><\/li><li><span class=\"n\">3<\/span><span>Merchant coverage<\/span><\/li><li><span class=\"n\">4<\/span><span>Lifestyle benefits<\/span><\/li><li><span class=\"n\">5<\/span><span>Travel benefits<\/span><\/li><li><span class=\"n\">6<\/span><span>Accessibility<\/span><\/li><li><span class=\"n\">7<\/span><span>Digital experience<\/span><\/li><li><span class=\"n\">8<\/span><span>Offer frequency<\/span><\/li><li><span class=\"n\">9<\/span><span>Transparency<\/span><\/li><li><span class=\"n\">10<\/span><span>Usability<\/span><\/li><\/ol><\/section>\n    <section class=\"stack--sm stack\"><h2 class=\"t-h3\">How offers and facts are verified<\/h2><p class=\"t-body\">Every card and offer shows a verified date and its source. An offer past its end date leaves the active lists and is never shown as live. Check terms with the bank before you pay.<\/p><\/section>\n    <aside class=\"ms-callout ms-callout--caution\"><div class=\"ms-callout__head\"><span class=\"ms-callout__mark\"><x-import component-from-global-scope=\"MoneySense.Icon\" name=\"clock\" size=\"16\"><\/x-import><\/span><span class=\"ms-callout__kind\">About this prototype<\/span><span class=\"ms-callout__rule\" aria-hidden=\"true\"><\/span><\/div><div class=\"ms-callout__main\"><div class=\"ms-callout__body\">All banks, cards, merchants and offers here are fictional. Real data will come from structured information supplied by participating banks and verified offers.<\/div><\/div><\/aside>\n    <section id=\"partners\" class=\"stack--sm stack\"><h2 class=\"t-h3\">For
